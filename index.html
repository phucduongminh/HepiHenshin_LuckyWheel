
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - Year of the Horse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --tet-red: #B91C1C;
            --tet-gold: #F59E0B;
            --tet-gold-light: #FEF3C7;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #450A0A;
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        .font-heading {
            font-family: 'Space Grotesk', sans-serif;
        }
        .font-festive {
            font-family: 'Playfair Display', serif;
        }
        
        .theme-tet {
            background: radial-gradient(circle at center, #991B1B, #450A0A);
            position: relative;
            min-height: 100vh;
        }
        .theme-tet::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("https://www.transparenttextures.com/patterns/cubes.png");
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
        }

        /* Subtle Horse Pattern Watermark */
        .horse-watermark {
            position: absolute;
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }

        .glass-panel {
            background: rgba(185, 28, 28, 0.2);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .gold-glow {
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.6), 0 0 30px rgba(245, 158, 11, 0.2);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes lantern-swing {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }
        .lantern {
            transform-origin: top center;
            animation: lantern-swing 4s ease-in-out infinite alternate;
        }

        .wheel-shadow {
            box-shadow: 0 0 120px -20px rgba(245, 158, 11, 0.35);
        }

        .pointer-active {
            animation: pointer-wiggle 0.15s ease-in-out infinite;
        }
        @keyframes pointer-wiggle {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            50% { transform: translateX(-50%) rotate(-8deg); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "canvas-confetti": "https://esm.sh/canvas-confetti@1.9.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="theme-tet">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
